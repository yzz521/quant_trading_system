name: build-app

# 三端桌面应用自动打包：
#   push v* tag → 在 macOS/Windows/Linux 三个 runner 上 PyInstaller 打包
#   → 产物上传 GitHub Release（Releases 页面直接下载安装）
#   也可手动触发（Actions → build-app → Run workflow）
#
# 产物文件名必须 ASCII：GitHub Release 会把「助手」从资源名剥掉变成 GP.-Windows.zip

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            artifact: GP-Assistant-macOS-arm64.zip
          - os: macos-26-intel    # Intel Mac
            artifact: GP-Assistant-macOS-x64.zip
          - os: windows-latest
            artifact: GP-Assistant-Windows.zip
          - os: ubuntu-latest
            artifact: GP-Assistant-Linux.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Linux 需要 GTK/WebKit 系统库（pywebview gtk 后端 import 依赖）
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 python3-gi

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -e ".[data,dashboard,gui]" pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller app/packaging/gp_assistant.spec --noconfirm
          ls -la dist/

      - name: Verify bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/GPAssistant/GPAssistant.exe
            test -f dist/GPAssistant/_internal/quant_trading_system/dashboard/首页.py
          elif [ "$RUNNER_OS" = "macOS" ]; then
            test -d dist/GP助手.app
            test -f dist/GP助手.app/Contents/Resources/quant_trading_system/dashboard/首页.py
          else
            test -f dist/GP助手/GP助手
            test -f dist/GP助手/_internal/quant_trading_system/dashboard/首页.py
          fi

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/mac-first-open.command
          cp packaging/desktop-readme.txt dist/使用说明.txt
          PY="$(command -v python3 || command -v python)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$PY" app/packaging/make_zip.py "dist/${{ matrix.artifact }}" dist/GPAssistant dist/使用说明.txt
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # 无 Apple 账号：本机 ad-hoc 签名（用户下载后仍须去隔离，见 首次打开.command）
            codesign --force --deep --sign - "dist/GP助手.app"
            cp packaging/mac-first-open.command "dist/首次打开.command"
            chmod +x "dist/首次打开.command"
            "$PY" app/packaging/make_zip.py "dist/${{ matrix.artifact }}" \
              "dist/GP助手.app" "dist/首次打开.command" dist/使用说明.txt
          else
            tar -C dist -czf "dist/${{ matrix.artifact }}" GP助手 使用说明.txt
          fi
          ls -la dist/${{ matrix.artifact }}

      # 手动触发（workflow_dispatch）也能在 Actions 页下载临时产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      # tag 触发 → 附到 GitHub Release
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
