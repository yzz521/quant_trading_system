name: release-portable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: quant_trading_system-portable-macos.zip
            script: start.command
          - os: windows-latest
            artifact: quant_trading_system-portable-windows.zip
            script: start.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Assemble portable bundle
        shell: bash
        run: |
          set -euo pipefail
          B=dist/quant_trading_system-portable
          mkdir -p "$B/quant_trading_system"
          # 只打包 git 跟踪文件（排除 .git/.venv/results 等）
          git archive HEAD | tar -x -C "$B/quant_trading_system"

          PY="$(uv python find 3.12)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PRT="$(dirname "$PY")"
            PY_BIN="$B/runtime/python.exe"
          else
            PRT="$(dirname "$(dirname "$PY")")"
            PY_BIN="$B/runtime/bin/python3"
          fi
          cp -R "$PRT" "$B/runtime"
          # 便携包副本可安全修改：去掉 PEP668 标记后用自带 pip 安装依赖
          rm -f "$B/runtime/lib/python3.12/EXTERNALLY-MANAGED"
          "$PY_BIN" -m pip install -q -r packaging/requirements-release.txt

          # 便携包默认关闭登录门禁（不携带任何个人密码）
          printf 'enabled: false\nusers: []\n' > "$B/quant_trading_system/config/users.yaml"
          cp "packaging/${{ matrix.script }}" "$B/"
          cp packaging/运行说明.txt "$B/README.txt"
          chmod +x "$B/start.command" 2>/dev/null || true

      - name: Zip bundle
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path quant_trading_system-portable -DestinationPath ${{ matrix.artifact }}"
          else
            ditto -c -k --sequesterRsrc quant_trading_system-portable "${{ matrix.artifact }}"
          fi

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
