# 复制为 config/users.yaml 后启用（勿提交真实密码到 git）
#   cp config/users.yaml.example config/users.yaml
#
# 生成 password_hash（在项目根）:
#   python -c "from quant_trading_system.dashboard.auth import hash_password; print(hash_password('你的密码'))"

enabled: true

# 会话保持多久（小时），刷新页面仍有效
session_ttl_hours: 168        # 默认 7 天；可改 24 / 72 / 336 等

# 会话签名密钥：真实值请放 config/secret.local.yaml（已 gitignore）或环境变量 QTS_SESSION_SECRET
# 此文件已提交公开仓库，切勿放真实密钥
session_secret: ""

users:
